services:
  postgres:
    image: postgres:18-trixie
    container_name: backstage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    volumes:
      - backstage-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backstage} -d ${POSTGRES_DB:-backstage}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backstage

  backstage:
    image: ${BACKSTAGE_IMAGE:-backstage:latest}
    container_name: backstage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      APP_BASE_URL: ${APP_BASE_URL}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
    ports:
      - "127.0.0.1:7007:7007"
    volumes:
      - backstage-techdocs:/app/packages/backend/static/docs
    networks:
      - backstage

volumes:
  backstage-postgres-data:
  backstage-techdocs:

networks:
  backstage:
