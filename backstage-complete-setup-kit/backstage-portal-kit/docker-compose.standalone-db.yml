# Optional standalone mode:
# Backstage runs as a Node.js process on the host while PostgreSQL remains
# containerized. This is useful if you do not want the Backstage process in Docker.

services:
  postgres:
    image: postgres:18-trixie
    container_name: backstage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - backstage-postgres-data:/var/lib/postgresql

volumes:
  backstage-postgres-data:
