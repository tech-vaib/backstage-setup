services:
  postgres:
    image: postgres:18
    container_name: backstage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backstage-postgres-data:/var/lib/postgresql
    networks:
      - backstage

  backstage:
    image: ${BACKSTAGE_IMAGE:-company-backstage:latest}
    container_name: backstage
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "7007:7007"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GHE_TOKEN: ${GHE_TOKEN:-}
    networks:
      - backstage

volumes:
  backstage-postgres-data:

networks:
  backstage:
